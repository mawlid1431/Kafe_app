<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Root is the public landing page, so the default title is the marketing one.
         The admin app overrides it per route once React mounts. -->
    <title>Kafe Eman — Order ahead, track live, earn rewards</title>
    <meta
      name="description"
      content="Kafe Eman is a coffee ordering app for Alor Setar, Penang and Kuala Lumpur. Order ahead, skip the queue, track your rider live, and earn points on every cup."
    />
    <meta name="theme-color" content="#608070" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#608070" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Red+Hat+Display:wght@600;700;800;900&family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Boot splash. Inlined so it paints on the first frame, before the app
         bundle downloads. Mirrors the BrandLoader spokes-bounce ring, and is
         removed by main.tsx as soon as React mounts. -->
    <style>
      #ke-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 22px;
        background:
          radial-gradient(ellipse 70% 55% at 20% 8%, rgba(96, 128, 112, 0.12), transparent 60%),
          radial-gradient(ellipse 55% 50% at 88% 82%, rgba(96, 128, 112, 0.08), transparent 60%),
          linear-gradient(180deg, #f0f3f1 0%, #f7f9f7 100%);
        font-family: 'Manrope', 'Plus Jakarta Sans', system-ui, sans-serif;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }

      #ke-boot[data-done='true'] {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #ke-boot .ring {
        position: relative;
        height: 104px;
        width: 104px;
        display: grid;
        place-items: center;
      }

      #ke-boot .arc {
        position: absolute;
        inset: 0;
        height: 100%;
        width: 100%;
        animation: ke-boot-spin 1.15s linear infinite;
      }

      #ke-boot .arc .track {
        fill: none;
        stroke: rgba(96, 128, 112, 0.16);
        stroke-width: 2.5;
      }

      #ke-boot .arc .head {
        fill: none;
        stroke: #608070;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-dasharray: 62 220;
      }

      @keyframes ke-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      #ke-boot .core {
        height: 62%;
        width: 62%;
        display: grid;
        place-items: center;
        overflow: hidden;
        border-radius: 26%;
        background: #fff;
        box-shadow:
          0 6px 18px -8px rgba(77, 99, 89, 0.45),
          inset 0 0 0 1px rgba(96, 128, 112, 0.14);
      }

      #ke-boot .core img {
        height: 100%;
        width: 100%;
        object-fit: contain;
        padding: 14%;
      }

      #ke-boot .label {
        font-family: 'Red Hat Display', 'Plus Jakarta Sans', system-ui, sans-serif;
        font-size: 17px;
        font-weight: 800;
        letter-spacing: -0.01em;
        color: #1f2623;
        text-align: center;
        margin: 0;
      }

      #ke-boot .tag {
        margin: 5px 0 0;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #608070;
        text-align: center;
      }

      #ke-boot .bar {
        position: relative;
        height: 3px;
        width: 132px;
        overflow: hidden;
        border-radius: 100px;
        background: rgba(96, 128, 112, 0.16);
      }

      #ke-boot .bar::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        width: 42%;
        border-radius: 100px;
        background: linear-gradient(
          90deg,
          rgba(96, 128, 112, 0.25),
          #608070,
          rgba(96, 128, 112, 0.25)
        );
        animation: ke-boot-slide 1.45s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      @keyframes ke-boot-slide {
        0% {
          left: -45%;
        }
        100% {
          left: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #ke-boot .arc,
        #ke-boot .bar::after {
          animation: none;
        }
        #ke-boot .bar::after {
          left: 0;
          width: 100%;
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <div id="ke-boot">
      <div class="ring">
        <svg class="arc" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="track" cx="50" cy="50" r="45" />
          <circle class="head" cx="50" cy="50" r="45" />
        </svg>
        <span class="core"><img src="/brand-logo.jpg" alt="" width="64" height="64" /></span>
      </div>
      <div>
        <p class="label">Kafe Eman</p>
        <p class="tag">Brew · Sip · Enjoy</p>
      </div>
      <span class="bar"></span>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
